<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Blog</title>
</head>
<body>
    {% for post in blog %}
    <h2>{{ post['title'] }} </h2>
    <h3>{{ post['subtitle'] }}</h3>
    <h4> Date: {{ post['date'] }}</h4>
    <p>{{ post['body'] }}</p>
    {% endfor %}
</body>
</html>
